services:
  salland1-metadata-wordpress:
    build: .
    container_name: salland1-metadata-wordpress
    environment:
      - SOURCE_URL=https://www.salland1.nl/wp-json/metadata/v1/current
      - FETCH_INTERVAL=60s
      - JITTER=10s
      - PORT=8080
      - LOG_LEVEL=info
      # Cover-art resolver (replaces cloud.hansvaneijsden.nl cover-art-salland1.php)
      - COVERART_ENABLED=true
      - COVERART_HUB_URL=http://172.21.0.66:9000
      - COVERART_HUB_INPUT=radio-cover-art
      - COVERART_HUB_SECRET=bestwelgeheim
      - COVERART_FALLBACK_IMAGE=https://www.salland1.nl/wp-content/uploads/2026/02/Salland1-Programmering-Placeholder-1024x1024.jpg
      - COVERART_SPECIAL_TRIGGER=Sallandschijf - 
      - COVERART_SPECIAL_URL=https://www.salland1.nl/wp-json/salland1/v1/sallandschijf
    networks:
      metanet:
        ipv4_address: 172.21.0.91
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  metanet:
    external: true
    name: metanet
